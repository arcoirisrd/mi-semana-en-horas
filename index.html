<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi semana en horas</title>
<meta name="description" content="¿Cuánto tiempo te quita la ciudad? Cuenta tu semana en 8 minutos, mira tu índice y pide tres medidas.">
<meta property="og:title" content="Mi semana en horas">
<meta property="og:description" content="¿Cuánto tiempo te quita la ciudad? Cuenta tu semana en 8 minutos y pide tres medidas.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://arcoirisrd.github.io/mi-semana-en-horas/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de una columna para móvil; barra de reloj fija arriba (horas perdidas y niebla), una escena por pantalla, botón de avance abajo */
/* Identidad IPU: azul noche, crema, dorado y azul de aviso. Oscuro primero; variante crema para modo claro */
:root{
  --bg:#172230; --surface:#1F2C3D; --ink:#F4F0E8; --muted:#A5AFBB; --line:#34445A;
  --accent:#D9A86C; --accent-ink:#172230; --accent-soft:#3A3428; --gold:#D9A86C;
  --signal:#86A8EC; --signal-soft:#22334F;
  --l1:#E8705F; --l2:#EEA055; --l3:#CBC56A; --l4:#62C98C;
  --s-agua:#6FA8E0; --s-luz:#E5BE5A; --s-movil:#B48AD6; --s-filas:#E58266; --s-res:#8C98A6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F4F0E8; --surface:#FFFFFF; --ink:#172230; --muted:#5A6574; --line:#DAD3C5;
  --accent:#172230; --accent-ink:#F4F0E8; --accent-soft:#E7E2D7; --gold:#A8783C;
  --signal:#2F5FB8; --signal-soft:#DFE7F6;
  --l1:#B8392A; --l2:#C2701A; --l3:#7A8A22; --l4:#2E7D4F;
  --s-agua:#2B7FB8; --s-luz:#C9920F; --s-movil:#8A5BB0; --s-filas:#C2563E; --s-res:#6F7A86; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F0E8; --surface:#FFFFFF; --ink:#172230; --muted:#5A6574; --line:#DAD3C5;
  --accent:#172230; --accent-ink:#F4F0E8; --accent-soft:#E7E2D7; --gold:#A8783C;
  --signal:#2F5FB8; --signal-soft:#DFE7F6;
  --l1:#B8392A; --l2:#C2701A; --l3:#7A8A22; --l4:#2E7D4F;
  --s-agua:#2B7FB8; --s-luz:#C9920F; --s-movil:#8A5BB0; --s-filas:#C2563E; --s-res:#6F7A86; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 40px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2.9rem}
h2{font-size:2rem}
h3{font-size:1.15rem;font-weight:600;font-family:var(--f-body);line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.act{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.clock{display:flex;gap:14px;font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.clock b{font-size:1.05rem}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.prog i{height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--gold)}
.fog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.fog i{display:block;height:100%;background:var(--signal);transition:width .3s}

.scene{display:grid;gap:16px}
.kicker{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.q{display:grid;gap:8px}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:48px;line-height:1.25}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],select,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.btn{font:inherit;font-weight:600;font-size:1.05rem;padding:14px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%;min-height:52px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.nav{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:4px}
.nav .btn.ghost{width:auto}
.note{background:var(--signal-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:.92rem}
.note b{color:var(--signal)}

.hero{display:grid;gap:14px;padding-block:24px 6px}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:96px;height:96px;flex:none}
.brand .ipu{font-family:var(--f-display);font-size:3.6rem;line-height:.85;color:var(--ink)}
.brand .sub{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);line-height:1.5}
.kicker{color:var(--gold)!important}
.tk{stroke:var(--ink)} .tk.b{stroke:var(--signal)} .hand{stroke:var(--ink)} .pin{fill:var(--gold)}
.facts{display:grid;gap:6px;font-size:.95rem;color:var(--muted)}

/* espejo */
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.score .n{font-family:var(--f-display);font-size:4.4rem;line-height:.85;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px;color:var(--bg)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line)}
.stack i{height:100%}
.keyl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.keyl span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.compare{display:grid;gap:10px}
.cmp{display:grid;gap:4px}
.cmp .lab{font-size:.88rem;color:var(--muted)}
.track{position:relative;height:18px;border-radius:4px;background:var(--line)}
.track .m{position:absolute;top:-3px;width:3px;height:24px;margin-left:-1.5px;background:var(--muted)}
.track .you{position:absolute;top:-4px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--gold);border:3px solid var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{min-height:40px;padding:8px 12px;border-radius:999px}

/* escalera */
.budgetbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:4}
.tokens{display:flex;gap:5px}
.tokens i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}
.tokens i.used{background:var(--gold)}
.live{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right}
.live b{font-size:1.1rem}
.level{display:grid;gap:8px}
.level h3{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.meas{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.meas[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.meas:disabled{opacity:.45;cursor:not-allowed}
.meas .nm{font-weight:600;line-height:1.25}
.meas .ct{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.meas .ds{grid-column:1/-1;font-size:.86rem;color:var(--muted);line-height:1.3}
.meas .who{grid-column:1/-1;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* pliego */
.pet{display:grid;gap:8px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px}
.pet .hd{display:flex;gap:10px;align-items:baseline}
.pet .rank{font-family:var(--f-display);font-size:1.6rem;color:var(--gold);line-height:1}
.pet button.x{margin-left:auto;font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}

/* cierre */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
.actions{display:grid;gap:10px}
a.btn{display:block;text-align:center;text-decoration:none}
.copied{font-size:.88rem;color:var(--accent);min-height:1.2em}
.privacy{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.privacy summary{cursor:pointer;font-weight:600;color:var(--signal)}
.privacy-body{display:grid;gap:8px;margin-top:10px;font-size:.9rem;line-height:1.4}
.consent{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.95rem;cursor:pointer}
.consent input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===== Envío a ArcGIS Online =====
   LAYER_URL: URL de la capa del formulario v3 terminada en /FeatureServer/0
   (se copia de la página del elemento de la capa en ArcGIS Online). Vacía = no se envía. */
const LAYER_URL = "https://services1.arcgis.com/C4QnL6lJusCeBpYO/arcgis/rest/services/service_cca532cc58d248eea6e338cfc5a624c6_form/FeatureServer/0";
const GAME_VERSION = "1.1";

const H5=[["Nada",0],["Menos de 1 hora",.5],["De 1 a 3 horas",2],["De 3 a 6 horas",4.5],["Más de 6 horas",8]];
const HM=[["Nada",0],["Hasta 1 hora",1],["De 1 a 4 horas",2.5],["De 4 a 8 horas",6],["Más de 8 horas",10]];
const SABE=[["Siempre lo sé",0],["A veces",.5],["Nunca lo sé",1]];
const MEAS=[
 {id:"agenda",n:1,who:"Hogares",c:0,nm:"Agenda vecinal de esperas",ds:"Turnos entre vecinas para esperar el agua y hacer filas.",ef:(s)=>({agua:[.8,1],filas:[.85,1]})},
 {id:"calendario",n:1,who:"Técnicos",c:1,nm:"Calendario de agua y luz, aviso a 24 h",ds:"Saber cuándo llega el agua y cuándo se va la luz.",ef:(s,f)=>{const r=f.norma?1:.5;return{agua:[1-r*.15,1-r*.5],luz:[1,1-r*.5]}}},
 {id:"cita",n:1,who:"Políticos",c:1,nm:"Cita previa y turnos por SMS",ds:"En oficinas, centros de salud y pagos de servicios.",ef:(s,f)=>{const r=f.norma?1:.5;return{filas:[1-r*.4,1-r*.5]}}},
 {id:"respaldo",n:2,who:"Hogares",c:2,nm:"Cisterna y energía comunitarias",ds:"Almacenamiento y paneles compartidos por manzana.",ef:()=>({agua:[.7,.7],luz:[.9,.8]})},
 {id:"sector",n:2,who:"Técnicos",c:3,nm:"Red de agua sectorizada y luz 24 h",ds:"Obra de red. Sin focalizar, llega tarde a los barrios más olvidados.",ef:(s,f)=>{const r=f.focal?1:.6;return{agua:[1-r*.6,1-r*.6],luz:[1-r*.7,1-r*.65]}}},
 {id:"corredor",n:2,who:"Políticos",c:3,nm:"Guaguas con carril propio y horario fijo",ds:"Frecuencia que se cumple y rutas que entran al barrio.",ef:(s,f)=>{if(s.modo==="carro")return{movil:[.9,.9]};const r=f.focal?1:.6;return{movil:[1-r*.3,1-r*.5]}}},
 {id:"focal",n:3,who:"Hogares",c:1,nm:"Presupuesto participativo guiado por el IPU",ds:"La obra entra primero donde más tiempo se pierde.",ef:()=>({})},
 {id:"norma",n:3,who:"Técnicos",c:1,nm:"Aviso obligatorio y observatorio",ds:"Que avisar sea una obligación y se mida si se cumple.",ef:()=>({})},
 {id:"cuidados",n:3,who:"Políticos",c:2,nm:"Sistema de cuidados con enfoque de género",ds:"Que esperar no recaiga siempre en una mujer sola.",ef:(s)=>s.espera==="sola"?{agua:[.65,1],filas:[.65,1]}:{}}
];
const LEVELS=[[1,"Escalón 1 · Día a día","Avisos, horarios y turnos"],[2,"Escalón 2 · Estructural","Obra y servicio"],[3,"Escalón 3 · Reglas","A quién llega lo demás"]];
const DESTINOS=["Ayuntamiento","Acueducto (CAASD u otro)","Empresa de electricidad (EDE)","Transporte (INTRANT / OMSA)","Gobierno central","Congreso"];
const BUDGET=5;

let S=initState(), step=0;
function initState(){return{consent:false,sent:false,muni:"",barrio:"",genero:"",espera:"",agua_freq:"",agua_sabe:null,agua_h:null,luz_freq:"",luz_sabe:null,luz_h:null,modo:"",movil_h:null,movil_sabe:null,reserva_min:null,trayectos:null,filas_h:null,filas_sabe:null,usos:[],reflexion:"",desorden:"",medidas:[],pets:[],otra:""}}

/* ===== Cálculo ===== */
function parts(s){
  const res=(s.reserva_min??0)*(s.trayectos??0)/60;
  return{agua:[s.agua_h??0,s.agua_sabe??0],luz:[s.luz_h??0,s.luz_sabe??0],movil:[s.movil_h??0,s.movil_sabe??0],filas:[s.filas_h??0,s.filas_sabe??0],reserva:res};
}
function ipuOf(p){
  const h=p.agua[0]+p.luz[0]+p.movil[0]+p.filas[0]+p.reserva;
  const answered=["agua","luz","movil","filas"];
  const u=answered.reduce((a,k)=>a+p[k][1],0)/4;
  return{h,u,ipu:100-(Math.min(100,5*h)+100*u)/2};
}
function withMeasures(s,ids){
  const p=parts(s);const f={focal:ids.includes("focal"),norma:ids.includes("norma")};
  const u0=p.movil[1]+p.filas[1];
  for(const m of MEAS){if(!ids.includes(m.id))continue;const e=m.ef(s,f);for(const k in e){p[k]=[p[k][0]*e[k][0],p[k][1]*e[k][1]]}}
  if(u0>0)p.reserva*=((p.movil[1]+p.filas[1])/u0);
  return p;
}
const lvl=v=>v<40?["Crítica","--l1"]:v<60?["Baja","--l2"]:v<80?["Media","--l3"]:["Alta","--l4"];
const fmt=(v,d=1)=>Number(v).toLocaleString("es-DO",{minimumFractionDigits:d,maximumFractionDigits:d});
const answeredCount=()=>["agua_sabe","luz_sabe","movil_sabe","filas_sabe"].filter(k=>S[k]!==null).length;

/* ===== Pantallas ===== */
const SCREENS=[
 {act:0,render:intro},
 {act:1,render:perfil,ok:()=>S.muni&&S.genero&&S.espera},
 {act:1,render:agua,ok:()=>S.agua_freq&&S.agua_sabe!==null&&S.agua_h!==null},
 {act:1,render:luz,ok:()=>S.luz_freq&&(S.luz_freq==="nunca"||(S.luz_sabe!==null&&S.luz_h!==null))},
 {act:1,render:movil,ok:()=>S.modo&&S.movil_h!==null&&S.movil_sabe!==null&&S.reserva_min!==null&&S.trayectos!==null},
 {act:1,render:filas,ok:()=>S.filas_h!==null&&S.filas_sabe!==null},
 {act:2,render:espejo,ok:()=>S.usos.length>0&&S.desorden},
 {act:3,render:escalera},
 {act:4,render:pliego,ok:()=>S.pets.length>0},
 {act:5,render:cierre}
];
const ACTS=["","I · Tu semana","II · El espejo","III · La escalera","IV · El pliego","Listo"];

function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content}
function optGroup(key,options,{two=false,multi=false,after}={}){
  const wrap=document.createElement("div");wrap.className=multi?"chips":"opts"+(two?" two":"");
  for(const[label,val]of options){const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=label;
    const on=multi?S[key].includes(val):S[key]===val;b.setAttribute("aria-pressed",String(on));
    b.onclick=()=>{if(multi){const i=S[key].indexOf(val);i>=0?S[key].splice(i,1):S[key].push(val)}else S[key]=val;after&&after();render()};
    wrap.appendChild(b)}
  return wrap;
}
function q(title,key,options,opts){const d=document.createElement("div");d.className="q";d.appendChild(el(`<h3>${title}</h3>`));d.appendChild(optGroup(key,options,opts));return d}

function hud(){
  const scr=SCREENS[step];if(scr.act===0)return null;
  const p=parts(S),r=ipuOf(p),n=answeredCount();
  const fog=n?(["agua_sabe","luz_sabe","movil_sabe","filas_sabe"].reduce((a,k)=>a+(S[k]??0),0)/n):0;
  const d=el(`<div class="hud"><div class="hud-row"><span class="act">${ACTS[scr.act]}</span><div class="clock"><span>Horas <b>${fmt(r.h)}</b></span><span>Niebla <b>${Math.round(fog*100)}%</b></span></div></div>
   <div class="prog">${[1,2,3,4].map(a=>`<i class="${a<=scr.act?"on":""}"></i>`).join("")}</div>
   <div class="fog" title="Niebla: cuánto no sabes de tu semana"><i style="width:${fog*100}%"></i></div></div>`);
  return d;
}
function nav(scene,{next="Seguir",canBack=true}={}){
  const ok=SCREENS[step].ok?SCREENS[step].ok():true;
  const d=el(`<div class="nav">${canBack?'<button type="button" class="btn ghost" id="back">Atrás</button>':"<span></span>"}<button type="button" class="btn" id="next" ${ok?"":"disabled"}>${next}</button></div>`);
  scene.appendChild(d);
  const b=scene.querySelector("#back");if(b)b.onclick=()=>{step--;render(true)};
  scene.querySelector("#next").onclick=()=>{step++;render(true)};
}

function gaugeSVG(){let t="";for(let i=0;i<60;i++){const a=(i*6-90)*Math.PI/180,big=i%5===0,R=46,L=big?8:4.5;
  t+=`<line class="tk${i===19||i===20?" b":""}" x1="${50+R*Math.cos(a)}" y1="${50+R*Math.sin(a)}" x2="${50+(R-L)*Math.cos(a)}" y2="${50+(R-L)*Math.sin(a)}" stroke-width="${big?2.4:1.3}"/>`}
  const a=150*Math.PI/180;return`<svg viewBox="0 0 100 100" aria-hidden="true">${t}<line class="hand" x1="50" y1="50" x2="${50+31*Math.cos(a)}" y2="${50+31*Math.sin(a)}" stroke-width="3" stroke-linecap="round"/><circle class="pin" cx="50" cy="50" r="4"/></svg>`}
const PRIVACY=`<div class="privacy-body">
  <p><b>Quién lo organiza.</b> Centro de Acción Social y Promoción del Desarrollo Arcoíris, ONG dominicana.</p>
  <p><b>Para qué.</b> Para estudiar cuánto tiempo pierde la gente por servicios que no se pueden prever en el Gran Santo Domingo y proponer políticas públicas. Publicamos siempre resultados agregados, nunca respuestas de una persona.</p>
  <p><b>Qué guardamos.</b> Tus respuestas, tu municipio y barrio, y si eres mujer u hombre. No pedimos nombre, teléfono, correo ni ubicación exacta. Lo que escribas en los campos libres puede citarse sin decir quién lo escribió, así que no pongas datos que te identifiquen.</p>
  <p><b>Dónde.</b> En la cuenta de ArcGIS Online de Arcoíris. Solo el equipo del estudio puede ver las respuestas.</p>
  <p><b>Tus derechos.</b> Participar es voluntario y puedes dejarlo cuando quieras. Como no guardamos datos personales, después de enviar no podemos localizar tus respuestas. Si tienes dudas, escribe a info@arcoirisrd.org o llama al 809 533 8710.</p>
  <p class="muted">Tratamiento conforme a la Ley 172-13 de protección de datos de carácter personal.</p></div>`;
function intro(sc){
  sc.appendChild(el(`<div class="hero"><div class="brand">${gaugeSVG()}<div><div class="ipu">IPU</div><div class="sub">Índice de<br>predictibilidad<br>urbana</div></div></div><span class="kicker">Juego · 8 minutos</span><h1>Mi semana en horas</h1>
  <p>Esperar el agua. Salir antes por si acaso. No saber cuándo se va la luz. Cuenta tu semana y mira cuánto tiempo te quita la ciudad.</p>
  
  <div class="facts"><span>1. Cuentas tu semana.</span><span>2. Ves tu índice y lo comparas.</span><span>3. Eliges qué cambiaría.</span><span>4. Pides tres medidas y dices a quién.</span></div>
  </div>`));
  sc.appendChild(el(`<details class="privacy" id="privacy"><summary>Cómo usamos tus datos</summary>${PRIVACY}</details>
  <label class="consent" for="consent"><input type="checkbox" id="consent" ${S.consent?"checked":""}><span>Tengo 18 años o más, he leído cómo se usan mis datos y acepto participar.</span></label>
  <button type="button" class="btn" id="start" ${S.consent?"":"disabled"}>Empezar</button>`));
  sc.querySelector("#consent").onchange=e=>{S.consent=e.target.checked;sc.querySelector("#start").disabled=!S.consent};
  sc.querySelector("#start").onclick=()=>{if(S.consent){step=1;render(true)}};
}
function perfil(sc){
  sc.appendChild(el(`<span class="kicker">Antes de empezar</span><h2>¿Dónde vives?</h2>`));
  const d=el(`<div class="q"><h3>Municipio</h3><select id="muni"><option value="">Elige</option>${["Distrito Nacional","Santo Domingo Este","Santo Domingo Norte","Santo Domingo Oeste","Los Alcarrizos","Pedro Brand","Boca Chica","San Antonio de Guerra","Bajos de Haina","Otro"].map(m=>`<option ${S.muni===m?"selected":""}>${m}</option>`).join("")}</select></div>
  <div class="q"><h3>Barrio o sector</h3><input type="text" id="barrio" autocomplete="off" placeholder="Ej.: Los Mina, La Ciénaga, Piedra Blanca" value="${S.barrio.replace(/"/g,"&quot;")}"></div>`);
  sc.appendChild(d);
  sc.querySelector("#muni").onchange=e=>{S.muni=e.target.value;render()};
  sc.querySelector("#barrio").oninput=e=>{S.barrio=e.target.value};
  sc.appendChild(q("Eres…","genero",[["Mujer","mujer"],["Hombre","hombre"],["Otra / prefiero no decir","otra"]]));
  sc.appendChild(q("Cuando hay que esperar el agua, una fila o una cita…","espera",[["Normalmente espero yo sola o solo","sola"],["Nos turnamos en casa","compartida"],["Espera otra persona","otra"]]));
  nav(sc);
}
function agua(sc){
  sc.appendChild(el(`<span class="kicker">Escena 1 de 4 · Agua</span><h2>El agua</h2>`));
  sc.appendChild(q("¿Cuántos días a la semana te llega el agua?","agua_freq",[["Todos los días","diaria"],["De 4 a 6 días","dias4a6"],["De 1 a 3 días","dias1a3"],["Rara vez o nunca","rara"]]));
  sc.appendChild(q("¿Sabes a qué hora o qué día va a llegar?","agua_sabe",SABE));
  sc.appendChild(q("¿Cuánto tiempo a la semana pasas esperándola, llenando o buscando agua?","agua_h",H5));
  nav(sc);
}
function luz(sc){
  sc.appendChild(el(`<span class="kicker">Escena 2 de 4 · Luz</span><h2>La luz</h2>`));
  sc.appendChild(q("¿Con qué frecuencia se va la luz?","luz_freq",[["Nunca o casi nunca","nunca"],["Alguna vez a la semana","semanal"],["Varias veces a la semana","varias"],["Todos los días","diaria"]],{after:()=>{if(S.luz_freq==="nunca"){S.luz_sabe=0;S.luz_h=0}}}));
  if(S.luz_freq&&S.luz_freq!=="nunca"){
    sc.appendChild(q("¿Sabes cuándo se va a ir?","luz_sabe",SABE));
    sc.appendChild(q("¿Cuánto tiempo a la semana pierdes o reorganizas por los apagones?","luz_h",H5));
    sc.appendChild(el(`<p class="note small">No te preguntamos las horas sin luz, sino el tiempo que tú pierdes: esperar para planchar, cocinar de noche, cargar el celular fuera, rehacer lo que se perdió.</p>`));
  }
  nav(sc);
}
function movil(sc){
  sc.appendChild(el(`<span class="kicker">Escena 3 de 4 · Moverte</span><h2>Moverte</h2>`));
  sc.appendChild(q("¿Cómo te mueves casi siempre?","modo",[["A pie","pie"],["Guagua o concho","publico"],["Motoconcho","motoconcho"],["Carro propio","carro"]],{two:true}));
  sc.appendChild(q("En una semana, ¿cuánto tiempo pierdes esperando transporte o en tapones?","movil_h",HM));
  sc.appendChild(q("¿Sabes cuánto vas a tardar cuando sales?","movil_sabe",SABE));
  sc.appendChild(q("¿Cuántos minutos sales antes de lo necesario, por si acaso?","reserva_min",[["Nada","0"],["Unos 10 minutos","10"],["Unos 20 minutos","20"],["Media hora","30"],["Más de 45 minutos","50"]].map(([a,b])=>[a,+b]),{two:true}));
  sc.appendChild(q("¿Cuántos viajes haces a la semana (ida o vuelta cuenta como uno)?","trayectos",[["De 2 a 4","3"],["De 5 a 9","7"],["10 o más","12"]].map(([a,b])=>[a,+b])));
  nav(sc);
}
function filas(sc){
  sc.appendChild(el(`<span class="kicker">Escena 4 de 4 · Filas y citas</span><h2>Filas, trámites y citas</h2>`));
  sc.appendChild(q("¿Cuánto tiempo a la semana pasas en filas, oficinas, centros de salud o pagando servicios?","filas_h",H5));
  sc.appendChild(q("¿Sabes cuánto vas a esperar cuando llegas?","filas_sabe",SABE));
  nav(sc,{next:"Ver mi semana"});
}
function espejo(sc){
  const p=parts(S),r=ipuOf(p);const[lab,col]=lvl(r.ipu);
  const jornadas=r.h*4.33/8;
  sc.appendChild(el(`<span class="kicker">Tu resultado</span><h2>Tu semana en el espejo</h2>
   <div class="score"><span class="n" style="color:var(${col})">${Math.round(r.ipu)}</span><div><span class="chip" style="background:var(${col})">Predictibilidad ${lab.toLowerCase()}</span><p style="margin-top:8px">Pierdes <b>${fmt(r.h)} horas</b> a la semana. Son unas <b>${fmt(jornadas)} jornadas de 8 horas</b> al mes.</p><p class="small muted" style="margin-top:4px">Niebla: ${Math.round(r.u*100)} % de tu semana no la puedes prever.</p></div></div>`));
  const segs=[["agua","Agua",p.agua[0],"--s-agua"],["luz","Luz",p.luz[0],"--s-luz"],["movil","Moverte",p.movil[0],"--s-movil"],["filas","Filas",p.filas[0],"--s-filas"],["res","Por si acaso",p.reserva,"--s-res"]];
  const tot=Math.max(r.h,.01);
  sc.appendChild(el(`<div class="q"><h3>¿Dónde se van tus horas?</h3><div class="stack" role="img" aria-label="Reparto de horas perdidas">${segs.map(s=>`<i style="width:${s[2]/tot*100}%;background:var(${s[3]})"></i>`).join("")}</div>
   <div class="keyl">${segs.map(s=>`<span style="--c:var(${s[3]})">${s[1]} ${fmt(s[2])} h</span>`).join("")}</div></div>`));
  const cmps=[];
  if(S.luz_freq==="diaria")cmps.push(["Con apagones todos los días",37],["Sin apagones",77]);
  if(S.agua_freq==="rara")cmps.push(["Con agua rara vez",21],["Con agua todos los días",66.5]);
  if(!cmps.length)cmps.push(["Encuesta v1 (barrios populares)",49.5],["Encuesta v2 (barrios de ingresos medios)",64]);
  sc.appendChild(el(`<div class="compare"><h3>Tú y quienes ya respondieron</h3>${cmps.map(([l,v])=>`<div class="cmp"><span class="lab">${l}: mediana ${fmt(v,v%1?1:0)}</span><div class="track"><span class="m" style="left:${v}%"></span><span class="you" style="left:${Math.max(2,Math.min(98,r.ipu))}%" title="Tú"></span></div></div>`).join("")}<p class="small muted">El círculo eres tú. La línea es la mediana de ese grupo en la encuesta de 2026.</p></div>`));
  if(S.genero==="mujer"&&S.espera==="sola")sc.appendChild(el(`<p class="note">En la encuesta, <b>el 60 % de las mujeres espera sola</b> el agua, las filas y las citas. Entre los hombres, el 31 %.</p>`));
  sc.appendChild(el(`<h2 style="margin-top:8px">Piensa un momento</h2>`));
  const d=document.createElement("div");d.className="q";d.appendChild(el(`<h3>Si recuperaras esas horas, ¿en qué las usarías?</h3>`));
  d.appendChild(optGroup("usos",[["Descansar","descanso"],["Estudiar","estudio"],["Trabajo pagado","trabajo"],["Cuidar a mi familia","cuidado"],["Mi comunidad","comunidad"],["Disfrutar","ocio"]],{multi:true}));sc.appendChild(d);
  sc.appendChild(q("¿Qué es lo que más te desordena la semana?","desorden",[["El agua","agua"],["La luz","luz"],["El transporte","movil"],["Las filas y citas","filas"]],{two:true}));
  const t=el(`<div class="q"><h3>¿Quieres contar algo más? <span class="muted small">(opcional)</span></h3><textarea id="reflexion" maxlength="400" placeholder="Por ejemplo: qué dejas de hacer cuando se va la luz">${S.reflexion}</textarea></div>`);
  sc.appendChild(t);sc.querySelector("#reflexion").oninput=e=>{S.reflexion=e.target.value};
  nav(sc);
}
function escalera(sc){
  const used=S.medidas.reduce((a,id)=>a+MEAS.find(m=>m.id===id).c,0);
  const now=ipuOf(parts(S)).ipu, after=ipuOf(withMeasures(S,S.medidas)).ipu;
  sc.appendChild(el(`<span class="kicker">Tienes ${BUDGET} fichas</span><h2>¿Qué cambiarías?</h2><p class="muted">Elige medidas hasta gastar tus fichas y mira cómo cambiaría tu semana. Las del escalón 3 no cambian nada solas: deciden si las otras llegan a tu barrio.</p>
   <div class="budgetbar"><div class="tokens" aria-label="${used} de ${BUDGET} fichas usadas">${Array.from({length:BUDGET},(_,i)=>`<i class="${i<used?"used":""}"></i>`).join("")}</div><div class="live">Tu índice ${Math.round(now)} → <b>${Math.round(after)}</b></div></div>`));
  for(const[n,name,sub]of LEVELS){
    const lv=document.createElement("div");lv.className="level";lv.appendChild(el(`<h3>${name}</h3><p class="small muted">${sub}</p>`));
    for(const m of MEAS.filter(x=>x.n===n)){const on=S.medidas.includes(m.id);
      const b=document.createElement("button");b.type="button";b.className="meas";b.setAttribute("aria-pressed",String(on));b.disabled=!on&&used+m.c>BUDGET;
      b.innerHTML=`<span class="who">${m.who}</span><span class="nm">${m.nm}</span><span class="ct">${m.c?m.c+" ficha"+(m.c>1?"s":""):"gratis"}</span><span class="ds">${m.ds}</span>`;
      b.onclick=()=>{const i=S.medidas.indexOf(m.id);i>=0?S.medidas.splice(i,1):S.medidas.push(m.id);render()};lv.appendChild(b)}
    sc.appendChild(lv);
  }
  if(S.medidas.some(id=>id==="calendario"||id==="cita")&&!S.medidas.includes("norma"))sc.appendChild(el(`<p class="note small">Sin <b>aviso obligatorio</b>, los avisos y turnos se cumplen a medias.</p>`));
  if(S.medidas.some(id=>id==="sector"||id==="corredor")&&!S.medidas.includes("focal"))sc.appendChild(el(`<p class="note small">Sin <b>presupuesto guiado por el IPU</b>, la obra llega tarde a los barrios donde más tiempo se pierde.</p>`));
  nav(sc,{next:"Hacer mi pliego"});
}
function pliego(sc){
  if(!S.pets.length&&S.medidas.length)S.pets=S.medidas.slice(0,3).map(id=>({id,dest:""}));
  sc.appendChild(el(`<span class="kicker">Tus peticiones</span><h2>Tu pliego</h2><p class="muted">Elige hasta tres medidas en orden de importancia y di a quién se las pides.</p>`));
  S.pets.forEach((p,i)=>{const m=MEAS.find(x=>x.id===p.id);
    const d=el(`<div class="pet"><div class="hd"><span class="rank">${i+1}</span><b>${m.nm}</b><button type="button" class="x" data-i="${i}">Quitar</button></div><label class="small muted" for="dest-${i}">Se la pido a</label><select id="dest-${i}"><option value="">Elige</option>${DESTINOS.map(x=>`<option ${p.dest===x?"selected":""}>${x}</option>`).join("")}</select></div>`);
    sc.appendChild(d);
    sc.querySelector(`#dest-${i}`).onchange=e=>{S.pets[i].dest=e.target.value};
    sc.querySelector(`.x[data-i="${i}"]`).onclick=()=>{S.pets.splice(i,1);render()};
  });
  if(S.pets.length<3){
    const left=MEAS.filter(m=>!S.pets.some(p=>p.id===m.id));
    const d=el(`<div class="q"><h3>Añadir una petición</h3><select id="addpet"><option value="">Elige una medida</option>${left.map(m=>`<option value="${m.id}">${m.nm}</option>`).join("")}</select></div>`);
    sc.appendChild(d);sc.querySelector("#addpet").onchange=e=>{if(e.target.value){S.pets.push({id:e.target.value,dest:""});render()}};
  }
  const t=el(`<div class="q"><h3>¿Pedirías otra cosa? <span class="muted small">(opcional)</span></h3><textarea id="otra" maxlength="300" placeholder="Escribe tu propia petición">${S.otra}</textarea></div>`);
  sc.appendChild(t);sc.querySelector("#otra").oninput=e=>{S.otra=e.target.value};
  nav(sc,{next:"Terminar"});
}
function attributes(r){
  const pet=i=>S.pets[i]||{};
  return{origen:"juego",version_juego:GAME_VERSION,consentimiento:"si",municipio:MUNI_CODE[S.muni]||"otro",barrio:S.barrio.trim().slice(0,100),genero:S.genero,espera_sola:S.espera,
    agua_frec:S.agua_freq,agua_sabe:S.agua_sabe,agua_h:S.agua_h,luz_frec:S.luz_freq,luz_sabe:S.luz_sabe,luz_h:S.luz_h,
    modo:S.modo,movil_h:S.movil_h,movil_sabe:S.movil_sabe,reserva_min:S.reserva_min,trayectos_sem:S.trayectos,filas_h:S.filas_h,filas_sabe:S.filas_sabe,
    h_total:+r.h.toFixed(2),u_media:+r.u.toFixed(3),ipu:+r.ipu.toFixed(1),
    usos_horas:S.usos.join(","),desorden:S.desorden,reflexion:S.reflexion.trim().slice(0,400),medidas_escalera:S.medidas.join(","),
    peticion_1:pet(0).id||null,destino_1:DEST_CODE[pet(0).dest]||null,peticion_2:pet(1).id||null,destino_2:DEST_CODE[pet(1).dest]||null,
    peticion_3:pet(2).id||null,destino_3:DEST_CODE[pet(2).dest]||null,peticion_otra:S.otra.trim().slice(0,300)};
}
const MUNI_CODE={"Distrito Nacional":"dn","Santo Domingo Este":"sde","Santo Domingo Norte":"sdn","Santo Domingo Oeste":"sdo","Los Alcarrizos":"alcarrizos","Pedro Brand":"pedro_brand","Boca Chica":"boca_chica","San Antonio de Guerra":"guerra","Bajos de Haina":"haina","Otro":"otro"};
const DEST_CODE={"Ayuntamiento":"ayuntamiento","Acueducto (CAASD u otro)":"acueducto","Empresa de electricidad (EDE)":"ede","Transporte (INTRANT / OMSA)":"transporte","Gobierno central":"gobierno","Congreso":"congreso"};
async function sendAnswers(r){
  const body=new URLSearchParams({f:"json",rollbackOnFailure:"true",features:JSON.stringify([{attributes:attributes(r)}])});
  const res=await fetch(LAYER_URL.replace(/\/+$/,"")+"/addFeatures",{method:"POST",body});
  const j=await res.json();
  if(j.error)throw new Error(j.error.message||"error");
  if(!j.addResults||!j.addResults[0]||!j.addResults[0].success)throw new Error((j.addResults&&j.addResults[0]&&j.addResults[0].error&&j.addResults[0].error.description)||"no guardado");
}
function cierre(sc){
  const r=ipuOf(parts(S));const[lab,col]=lvl(r.ipu);const after=ipuOf(withMeasures(S,S.medidas)).ipu;
  const pets=S.pets.map(p=>{const m=MEAS.find(x=>x.id===p.id);return m.nm+(p.dest?` (a ${p.dest})`:"")});
  if(S.otra.trim())pets.push(S.otra.trim());
  const text=`Mi semana en horas: pierdo ${fmt(r.h)} horas a la semana y mi índice de predictibilidad es ${Math.round(r.ipu)} de 100. Pido: ${pets.map((p,i)=>`${i+1}) ${p}`).join("; ")}.`;
  sc.appendChild(el(`<span class="kicker">Gracias</span><h2>Esta es tu semana</h2>
   <div class="card"><div class="row"><span class="muted">Índice de predictibilidad</span><span class="chip" style="background:var(${col})">${lab}</span></div>
   <div class="row"><span style="font-family:var(--f-display);font-size:3.4rem;line-height:.9;color:var(${col})">${Math.round(r.ipu)}</span><span class="small muted" style="text-align:right">${fmt(r.h)} h perdidas por semana<br>con tus medidas: ${Math.round(after)}</span></div>
   <div><b>Mi pliego</b><ol>${pets.map(p=>`<li>${p.replace(/</g,"&lt;")}</li>`).join("")}</ol></div>
   <p class="small muted">${S.barrio?S.barrio.replace(/</g,"&lt;")+", ":""}${S.muni}</p></div>
   <div class="actions">
     ${LAYER_URL?`<button type="button" class="btn" id="send" ${S.sent?"disabled":""}>${S.sent?"Respuestas enviadas":"Sumar mi semana al estudio"}</button><p class="small muted" id="sendmsg" aria-live="polite">${S.sent?"Gracias. Tu semana ya forma parte del estudio.":"Se envían tus respuestas de forma anónima."}</p>`:`<button type="button" class="btn" disabled>Sumar mi semana al estudio</button><p class="note small"><b>Prototipo:</b> el envío se activa cuando se configure la capa de ArcGIS.</p>`}
     <a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Compartir por WhatsApp</a>
     <button type="button" class="btn ghost" id="copy">Copiar mi resumen</button><p class="copied" id="copied" aria-live="polite"></p>
     <textarea id="sumtxt" readonly hidden>${text}</textarea>
     <button type="button" class="btn ghost" id="again">Jugar otra vez</button></div>`));
  sc.querySelector("#copy").onclick=()=>{const done=()=>{sc.querySelector("#copied").textContent="Copiado."};
    try{navigator.clipboard.writeText(text).then(done).catch(fb)}catch(e){fb()}
    function fb(){const ta=sc.querySelector("#sumtxt");ta.hidden=false;ta.select();sc.querySelector("#copied").textContent="Selecciona el texto y cópialo."}};
  const sb=sc.querySelector("#send");
  if(sb&&!S.sent)sb.onclick=async()=>{const m=sc.querySelector("#sendmsg");sb.disabled=true;sb.textContent="Enviando…";
    try{await sendAnswers(r);S.sent=true;sb.textContent="Respuestas enviadas";m.textContent="Gracias. Tu semana ya forma parte del estudio."}
    catch(e){sb.disabled=false;sb.textContent="Intentar de nuevo";m.textContent="No se pudo enviar. Revisa tu conexión e inténtalo otra vez."}};
  sc.querySelector("#again").onclick=()=>{S=initState();step=0;render(true)};
}

function render(scrollTop){
  const app=document.getElementById("app");app.innerHTML="";
  const h=hud();if(h)app.appendChild(h);
  const sc=document.createElement("div");sc.className="scene";SCREENS[step].render(sc);app.appendChild(sc);
  if(scrollTop)window.scrollTo(0,0);
}
render();
</script>

</body>
